[build-system]
build-backend = "mesonpy"
requires = ["meson-python>=0.15.0", "pybind11>=2.10"]

[project]
name = "breifast-helpers-cpp"
version = "0.1.0"
description = "C++-accelerated helper routines for breifast (pybind11/xtensor bindings)"
requires-python = ">=3.9"

[tool.meson-python.args]
setup = ["-Dbuildtype=debugoptimized"]
